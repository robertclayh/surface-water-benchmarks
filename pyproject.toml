[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swbench"
version = "0.1.0"
description = "Label-efficiency and cost benchmark of geospatial foundation models (Prithvi, Clay) vs. a U-Net for surface water mapping on Sentinel-2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "rasterio>=1.3",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Pretrained encoders are loaded through IBM/NASA's TerraTorch, which vendors
# both the Prithvi-EO-2.0 ViT and the Clay v1.5 encoder.
fm = ["terratorch>=1.2", "huggingface_hub>=0.23", "einops>=0.7", "python-box>=7.0", "timm>=1.0"]
energy = ["nvidia-ml-py>=12.0"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
swbench-train = "swbench.cli:train_main"
swbench-sweep = "swbench.cli:sweep_main"
swbench-cost = "swbench.cli:cost_main"
swbench-report = "swbench.cli:report_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
