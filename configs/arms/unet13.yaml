name: unet13
model:
  arch: unet
  protocol: scratch
  bands: s1f11_13       # all 13 bands: the strongest practical from-scratch baseline
  kwargs: {base_width: 32, depth: 4, dropout: 0.1}
train:
  lr: 3.0e-3            # tuned on valid: 3e-4 .837, 1e-3 .839, 3e-3 .842, 1e-2 .809
