_base_: ../base.yaml
name: prithvi_frozen
model:
  arch: prithvi
  protocol: frozen      # encoder weights fixed; only the decoder is trained
  bands: prithvi6
  kwargs:
    variant: prithvi_eo_v2_300
    out_indices: [5, 11, 17, 23]
    ckpt_path: null     # null = download ibm-nasa-geospatial/Prithvi-EO-2.0-300M
train:
  lr: 3.0e-4            # tuned on valid: 1e-4 .781, 3e-4 .791, 1e-3 .783, 3e-3 .768
